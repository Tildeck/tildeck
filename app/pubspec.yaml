name: tildeck
description: "Tildeck: a free, open source SSH client with end-to-end encrypted sync."
publish_to: 'none'

# The product version comes from the repo-root VERSION file; the release
# workflow writes it here. Pull requests never change it.
version: 0.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  dartssh2: ^4.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Local terminals on the desktop (ConPTY on Windows).
  flutter_pty: ^0.4.2
  http: ^1.4.0
  intl: any
  # Generated from server/openapi.json by `scripts/local.sh contract`.
  path_provider: ^2.1.5
  # Key generation (RSA) and fingerprints; dartssh2 already depends on it.
  pointycastle: ^4.0.0
  sodium: ^4.0.4
  tildeck_api:
    path: packages/tildeck_api
  # A patched copy of xterm 4.0.0: see third_party/xterm/PATCHES.md.
  xterm:
    path: third_party/xterm

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the ARB files on every
  # pub get and build. The generated files are not committed.
  generate: true
  assets:
    # Common passwords refused as master passwords (lib/vault/password_rules.dart).
    - assets/security/common-passwords.txt
  fonts:
    # Heebo, SIL Open Font License 1.1 (assets/fonts/OFL.txt). Bundled so
    # Hebrew and English render the same on every device and in golden tests.
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Heebo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Heebo-ExtraBold.ttf
          weight: 800
    # JetBrains Mono, SIL Open Font License 1.1
    # (assets/fonts/jetbrains-mono/OFL.txt): the terminal font, bundled so
    # terminals look the same on every device and in golden tests.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Bold.ttf
          weight: 700
