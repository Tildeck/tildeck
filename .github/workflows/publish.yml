name: Publish release

# Runs when scripts/release.sh pushes a vX.Y.Z tag. A release cannot ship
# broken: everything is gated on the full verification, the same jobs CI
# runs. Then, in order:
#   1. the server image (with the panel) is pushed to GHCR,
#   2. the signed Android APK and the zipped Windows client are built,
#   3. a GitHub Release is created from the version's CHANGELOG section with
#      both files attached, and published only when all of them exist.
# A published version is never rewritten: an existing published release, or
# a tag that does not match VERSION, stops the run.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tildeck/tildeck-server

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag name reaches the shell through the environment, never by
      # interpolation: a ref is attacker-supplied text.
      - name: Tag matches VERSION, and the release is not published yet
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match VERSION $version." >&2
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Release $TAG is already published and is never rewritten." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        area: [server, panel, image, app, contract, guards]
    uses: ./.github/workflows/verify-area.yml
    with:
      area: ${{ matrix.area }}

  server-image:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          file: ./server/Dockerfile
          build-contexts: panel=./panel
          target: runtime
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ needs.preflight.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          # Build provenance and an SBOM attached to the image in GHCR.
          provenance: mode=max
          sbom: true

  android:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release key lives only in the "release" environment's secrets.
      # It is written to a file under the ignored out/ directory for the
      # build and removed afterwards; nothing prints it.
      - name: Build the signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TILDECK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TILDECK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TILDECK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$TILDECK_KEYSTORE_PASSWORD" ] || [ -z "$TILDECK_KEY_ALIAS" ] || [ -z "$TILDECK_KEY_PASSWORD" ]; then
            echo "The Android signing secrets are not set in the release environment." >&2
            exit 1
          fi
          mkdir -p out
          trap 'rm -f out/release.keystore' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > out/release.keystore
          export TILDECK_KEYSTORE_FILE=/work/out/release.keystore
          # Single quotes on purpose: $ANDROID_HOME expands in the container.
          # shellcheck disable=SC2016
          bash -c 'source scripts/lib/common.sh && flutter_run "
            flutter pub get --enforce-lockfile >/dev/null &&
            flutter build apk --release &&
            \$ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -v Signer.*public.key
          "'
          cp app/build/app/outputs/flutter-apk/app-release.apk "out/tildeck-$VERSION.apk"

      - name: Keep the APK for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: out/tildeck-${{ needs.preflight.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: [preflight, verify]
    uses: ./.github/workflows/windows-build.yml
    with:
      package: true

  release:
    needs: [preflight, server-image, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      # The notes are this version's CHANGELOG section, as reviewed in the
      # release commit. A draft is created (or reused on a re-run), the
      # files are attached, and only then is it published.
      - name: Create and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi
          # \x60 is a backtick: the image reference as Markdown code.
          printf '\n### Server image\n\n\x60%s\x60\n' "$IMAGE_REF" >> "$notes"
          ls -la "$RUNNER_TEMP/assets"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Tildeck $VERSION" --notes-file "$notes"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
          gh release edit "$TAG" --draft=false
