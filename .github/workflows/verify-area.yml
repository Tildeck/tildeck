name: Verify area

# Reusable job: one scripts/verify.sh area on a GitHub-hosted Linux runner
# with Docker. Called by ci.yml (changed areas, or all of them) and by
# publish.yml (the release gate), so the definition lives in one place.
on:
  workflow_call:
    inputs:
      area:
        description: server, panel, image, app, contract, or guards
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guards list tracked files and --changed compares with main.
          fetch-depth: 0
          persist-credentials: false

      # The app area needs the Flutter image, the Android NDK, and libsodium
      # built for three Android ABIs, which outgrows the runner's free disk.
      # Everything removed here is preinstalled runner tooling this
      # repository never uses: all builds run in the pinned containers.
      - name: Free disk space
        if: inputs.area == 'app'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Verify ${{ inputs.area }}
        # The area reaches the shell through the environment, never by
        # interpolating ${{ }} into the script: inputs are data, and
        # interpolation would let a crafted value run as shell code.
        env:
          AREA: ${{ inputs.area }}
        run: bash scripts/verify.sh --area "$AREA"
